[workspace]
members = [
  "crates/conversion-core",
  "crates/desktop",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
